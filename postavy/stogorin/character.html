<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stogorin</title>
  <link rel="stylesheet" href="https://mindor-tv.github.io/popel_trisiasu/style.css?v=20260520225113">

  <header>
    <button class="menu-button" id="menu-toggle">☰</button>

  </header>

  <!-- Levé menu -->
  <nav id="side-menu" class="menu"></nav>

  <main class="character-page">
    <section class="character-container">
      <h2 class="character-name">Stogorin</h2>
      <p class="character-description">
        Popis charakteru, schopnosti, příběh a další informace. Tento text je statický a hráči ho nemohou měnit.
      </p>

      <h3 class="adventures-title">Dobrodružství která prožil:</h3>

        <div class="adventure">  
        </div>
    </section>
  </main>

  <!-- Pravý slider s obrázky -->
  <aside id="character-slider" class="character-slider">
    <img src="images/stogorin1.png" alt="Character Image 1" class="character-image" data-caption="Stogorin">
  </aside>

  <div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <span class="prev">&#10094;</span>
    <div class="lightbox-content">
      <img class="lightbox-img" src="">

    </div>
    <span class="next">&#10095;</span>

  <footer class="site-footer">
    <span>© 2026 Michal David</span>
  </footer>
