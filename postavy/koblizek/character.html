<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charakter hráče – Popel Trisiasu</title>
  <link rel="stylesheet" href="https://mindor-tv.github.io/popel_trisiasu.github.io/style.css">
</head>
<body>
  <header>
    <button id="menu-toggle" class="menu-button">☰</button>
    <h1 class="header-title">Charakter hráče</h1>
    <nav id="side-menu" class="menu hidden"></nav>
  </header>

  <main class="character-page">
    <!-- Střední obsah -->
    <section class="character-details">
      <h2>Jméno charakteru</h2>
      <p>Popis charakteru, schopnosti, příběh a další informace. Tento text je statický a hráči ho nemohou měnit.</p>
      <a id="character-pdf" href="assets/char-sheet.pdf" target="_blank">Stáhnout Character Sheet (PDF)</a>
    </section>

    <!-- Pravý vysouvací slider -->
    <aside class="character-images">
      <button id="slider-toggle">Obrázky ➤</button>
      <div class="slider hidden">
        <img src="assets/img1.jpg" alt="Charakter 1">
        <img src="assets/img2.jpg" alt="Charakter 2">
        <img src="assets/img3.jpg" alt="Charakter 3">
        <!-- Další obrázky podle potřeby -->
      </div>
    </aside>
  </main>

  <script src="https://mindor-tv.github.io/popel_trisiasu.github.io/script.js" defer></script>
  </body>
</html>
