<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z Popela</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preload" as="image" href="assets/background.png">
  <link rel="preload" as="image" href="assets/z_popela_logo.png">
  <link rel="preload" as="image" href="assets/home-banners/aeriel.png">
  <link rel="preload" as="image" href="assets/home-banners/bogdan.png">
  <link rel="preload" as="image" href="assets/home-banners/celeana.png">
  <link rel="preload" as="image" href="assets/home-banners/ofelie.png">
  <link rel="preload" as="image" href="assets/home-banners/thalor.png">
</head>
<body>
  <header>
    <h1 class="header-title">Z Popela</h1>
    <nav id="side-menu" class="menu"></nav>
  </header>

  <main class="home-page">
    <section class="home-intro">
      <img src="assets/z_popela_logo.png" alt="Logo Popel Trisiasu" class="home-logo">
    </section>

    <section class="home-grid" aria-label="Rozcestník webu">
      <button class="home-card" type="button" data-home-popup="druzina">
        <span>Družina</span>
      </button>

      <button class="home-card" type="button" data-home-popup="mapy">
        <span>Mapy</span>
      </button>

      <button class="home-card" type="button" data-home-popup="mista">
        <span>Místa</span>
      </button>

      <button class="home-card" type="button" data-home-popup="npc">
        <span>NPC</span>
      </button>

      <button class="home-card" type="button" data-home-popup="bozstvo">
        <span>Božstvo</span>
      </button>

      <a class="home-card" href="dejiny-oblagunu.html">
        <span>Dějiny Oblagunu</span>
      </a>

      <button class="home-card" type="button" data-home-popup="spellbook">
        <span>Spellbook</span>
      </button>

      <a class="home-card" href="cheatsheet.html">
        <span>Cheatsheet</span>
      </a>
    </section>
  </main>

  <div id="home-popup" class="home-popup" aria-hidden="true">
    <div class="home-popup__panel" role="dialog" aria-modal="true">
      <button class="home-popup__close" type="button" aria-label="Zavřít">&times;</button>
      <h2 class="home-popup__title"></h2>
      <div class="home-popup__content"></div>
    </div>
  </div>

  <footer class="site-footer">
    <span>© 2026 Michal David</span>
  </footer>
  <script src="script.js"></script>
</body>
</html>
