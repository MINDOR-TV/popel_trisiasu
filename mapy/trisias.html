<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trisias</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header>
    <button id="menu-toggle" class="menu-button">☰</button>
    <h1 class="header-title">Z Popela</h1>
    <nav id="side-menu" class="menu"></nav>
  </header>

  <main class="map-page">
    <div class="map-container">
      <h2 class="map-title">Trisias</h2>

      <div class="map-image-wrapper">
        <!-- hlavní mapa – všimni si, že NEMÁ class="character-image" -->
        <img
          id="map"
          src="../assets/mapy/Trisias.png"
          alt="Mapa Varky"
          class="map-image"
        >

        <!-- okénko s přiblížením -->
        <div id="map-lens" class="map-lens"></div>
      </div>
    </div>
  </main>
  <script src="../script.js"></script>
</body>
</html>
