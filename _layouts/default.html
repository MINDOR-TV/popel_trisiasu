<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title | default: "Popel Trisiasu" }}</title>
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/base.css" />
</head>
<body>
  <header class="topbar">
    <button id="hamburger" aria-label="Otevřít menu" aria-expanded="false" aria-controls="sidebar">☰</button>

  {% include sidebar.html %}

  <div class="backdrop" id="backdrop" hidden></div>

  <main class="content" id="content">

  <script src="{{ site.baseurl }}/assets/js/sidebar.js" defer></script>
</body>
</html>
