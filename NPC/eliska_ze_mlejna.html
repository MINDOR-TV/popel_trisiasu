<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eliška ze mlejna</title>
  <link rel="stylesheet" href="https://mindor-tv.github.io/popel_trisiasu/style.css">
</head>
<body>
  <header>
    <button class="menu-button" id="menu-toggle">☰</button>
    <h1 class="header-title">NPC</h1>
    <button class="images-button" id="images-toggle">🖼️</button>
  </header>

  <!-- Levé menu -->
  <nav id="side-menu" class="menu"></nav>

  <main class="character-page">
    <section class="character-container">
      <h2 class="character-name">Eliška ze mlejna</h2>
      <p class="character-description">
        Eliška je milující žena mlynáře Jindřicha. Je velice oblíbenou obyvatelkou Popelgradu, která je známá svým srdcem ze zlata a milou povahou.
      </p>
        <div class="adventure">  
        </div>
    </section>
  </main>

  <!-- Pravý slider s obrázky -->
  <aside id="character-slider" class="character-slider">
    <img src="images/eliska_ze_mlejna.png" alt="Character Image 1" class="character-image" data-caption="Eliška ze mlejna">
  </aside>

  <div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <span class="prev">&#10094;</span>
    <div class="lightbox-content">
      <img class="lightbox-img" src="">
      <p class="lightbox-caption"></p>
    </div>
    <span class="next">&#10095;</span>
  </div>

  <footer class="site-footer">
    <span>© 2026 Michal David</span>
  </footer>
  <script src="https://mindor-tv.github.io/popel_trisiasu/script.js" defer></script>
</body>
</html>
